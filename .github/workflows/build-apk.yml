name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Genera le cartelle Android/iOS e imposta minSdk 24
        run: ./tool/setup_platforms.sh

      - name: Test
        run: flutter test

      - name: Compila APK (uno per architettura, più leggeri)
        run: flutter build apk --release --split-per-abi

      - name: Pubblica come release scaricabile dal telefono
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: ClipForge build ${{ github.run_number }}
          body: |
            Per quasi tutti i telefoni Android recenti scarica **app-arm64-v8a-release.apk**.
          files: build/app/outputs/flutter-apk/*-release.apk
