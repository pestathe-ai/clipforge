name: clipforge
description: Editor video open source in stile CapCut, scritto in Flutter con FFmpeg.
publish_to: "none"
version: 0.8.0+8

environment:
  sdk: ">=3.4.0 <4.0.0"
  flutter: ">=3.27.0"

dependencies:
  flutter:
    sdk: flutter
  # FFmpeg per Android/iOS (fork mantenuto di ffmpeg_kit_flutter, build GPL completa)
  ffmpeg_kit_flutter_new: ^4.6.1
  video_player: ^2.9.2
  file_picker: ">=10.3.3 <11.0.0"
  path_provider: ^2.1.4
  path: ^1.9.0
  gal: ^2.3.0
  # Riconoscimento vocale offline (Whisper) per i sottotitoli automatici
  sherpa_onnx: ^1.13.8
  # Registrazione della voce fuori campo
  record: ^7.1.2
  # Rimozione dello sfondo (segmentazione delle persone, sul telefono)
  google_mlkit_selfie_segmentation: ^0.12.1
  # Ritaglio dell'oggetto (spot prodotto)
  google_mlkit_subject_segmentation: ^0.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/fonts/Poppins-Bold.ttf
  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Bold.ttf
          weight: 700
