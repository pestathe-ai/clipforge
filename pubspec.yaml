name: clipforge
description: Editor video open source in stile CapCut, scritto in Flutter con FFmpeg.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"
  flutter: ">=3.27.0"

dependencies:
  flutter:
    sdk: flutter
  # FFmpeg per Android/iOS (fork mantenuto di ffmpeg_kit_flutter, build GPL completa)
  ffmpeg_kit_flutter_new: ^4.6.1
  video_player: ^2.9.2
  file_picker: ">=10.3.3 <11.0.0"
  path_provider: ^2.1.4
  path: ^1.9.0
  gal: ^2.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/fonts/Poppins-Bold.ttf
  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Bold.ttf
          weight: 700
